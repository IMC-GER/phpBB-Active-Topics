<script>
	// Toggle the input field topics_per_page
	const imcgerAtToggle = function() {
		const isCat = document.getElementById('forum_type').value == '{{ FORUM_CAT }}';

		document.getElementById('imcger_aktive_topics_per_page').disabled = !isCat;
		document.getElementById('topics_per_page').disabled = isCat;
	};

	document.getElementById('forum_type').addEventListener('change', imcgerAtToggle);

	// Set the state on page load
	imcgerAtToggle();
</script>
