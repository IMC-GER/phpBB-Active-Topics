{% if S_DISPLAY_ACTIVE %}
<script>
	if (document.querySelector('.forumbg dt#active_topics')) {
		const forumbg	= document.querySelector('.forumbg');
		const forabg	= document.querySelector('.forabg');
		const actionBar = document.querySelector('.action-bar.bar-top');

	{% if IMCGER_AT_DISPLAY_POS %}
		if (forumbg && forabg) {
			forabg.parentNode.insertBefore(forumbg, forabg);
		}

		if (actionBar && forumbg) {
			forumbg.parentNode.insertBefore(actionBar, forumbg);
		}
	{% else %}
		if (actionBar && forumbg) {
			forumbg.parentNode.insertBefore(actionBar, forumbg.nextSibling); 
		}
	{% endif %}
	}
</script> 
{% endif %}
